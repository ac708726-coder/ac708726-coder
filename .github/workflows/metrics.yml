name: Profile metrics

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile dashboard
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ac708726-coder
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: columns
          config_timezone: Asia/Kolkata
          extras_css: |
            svg.columns .items-wrapper { column-count: 2 !important; }
          repositories_skipped: |
            ac708726-coder/POT-HOLE-DETECTION7
            ac708726-coder/forest-change-detection
          plugins_errors_fatal: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_lines_delay: 0
          plugin_lines_sections: base, repositories, history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
          plugin_repositories: yes
          plugin_repositories_featured: ac708726-coder/POT-HOLE-DETECTION
