    <text x="330" y="207" fill="#AAB4C5" font-family="Cascadia Code, Consolas, monospace" font-size="15" letter-spacing="4">AI / ML DEVELOPER</text>

    <text x="42" y="282" fill="#F4F7FB" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="2.4">MODELS THAT SEE</text>
    <circle cx="199" cy="277" r="3" fill="#506BFF"/>
    <text x="216" y="282" fill="#F4F7FB" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="2.4">LEARN</text>
    <circle cx="282" cy="277" r="3" fill="#9D4EDD"/>
    <text x="299" y="282" fill="#F4F7FB" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="2.4">SHIP</text>

    <g stroke="url(#signal)" stroke-width="1.5" stroke-opacity="0.7">
      <path d="M799 91L896 56L992 104L1122 67" stroke-dasharray="8 10">
        <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M799 91L868 168L992 104L1070 190L1122 67" stroke-dasharray="8 10">
        <animate attributeName="stroke-dashoffset" values="0;36" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M868 168L794 244L930 265L1070 190L1152 252" stroke-dasharray="8 10">
        <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.7s" repeatCount="indefinite"/>
      </path>
      <path d="M896 56L930 265M992 104L1152 252" stroke-opacity="0.3"/>
    </g>

    <g fill="#080B10" stroke="url(#signal)" stroke-width="2">
      <circle cx="799" cy="91" r="8"/><circle cx="896" cy="56" r="6"/>
      <circle cx="992" cy="104" r="10"/><circle cx="1122" cy="67" r="7"/>
      <circle cx="868" cy="168" r="9"/><circle cx="1070" cy="190" r="11"/>
      <circle cx="794" cy="244" r="7"/><circle cx="930" cy="265" r="9"/>
      <circle cx="1152" cy="252" r="7"/>
    </g>

    <circle cx="992" cy="104" r="4" fill="#C7FF36" filter="url(#glow)">
