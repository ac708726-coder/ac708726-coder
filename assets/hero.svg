    <path d="M0 252H1200" stroke="#C8D1E0" stroke-opacity="0.12"/>
    <path d="M742 0V320" stroke="#C8D1E0" stroke-opacity="0.12"/>

    <rect x="42" y="34" width="10" height="10" fill="#C7FF36">
      <animate attributeName="opacity" values="1;.15;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <text x="68" y="44" fill="#AAB4C5" font-family="Cascadia Code, Consolas, monospace" font-size="13" letter-spacing="3">IDENTITY / 0611</text>
