<svg width="1200" height="240" viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ink" x1="240" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="0.5" stop-color="#7C3AED" />
      <stop offset="1" stop-color="#0891B2" />
    </linearGradient>
    <style>
      .surface { fill: #F8FAFC; }
      .rule { stroke: #CBD5E1; }
      .name { fill: #111827; }
      .role { fill: #64748B; }
      @media (prefers-color-scheme: dark) {
        .surface { fill: #0D1117; }
        .rule { stroke: #30363D; }
        .name { fill: #F0F6FC; }
        .role { fill: #8B949E; }
      }
    </style>
    <clipPath id="frame">
      <rect width="1200" height="240" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect class="surface" width="1200" height="240" />
    <line class="rule" x1="72" y1="48" x2="1128" y2="48" stroke-width="1" />
    <line class="rule" x1="72" y1="192" x2="1128" y2="192" stroke-width="1" />

    <text class="role" x="72" y="31" font-family="Courier New, ui-monospace, monospace" font-size="12" letter-spacing="2.4">PROFILE / 0611</text>
    <text class="role" x="1128" y="31" text-anchor="end" font-family="Courier New, ui-monospace, monospace" font-size="12" letter-spacing="2.4">AI + ML</text>

    <text class="name" x="600" y="133" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="600">Asmodeus0611</text>
    <text class="role" x="600" y="169" text-anchor="middle" font-family="Courier New, ui-monospace, monospace" font-size="15" letter-spacing="5">AI / ML DEVELOPER</text>

    <path d="M430 151H770" stroke="url(#ink)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 340;340 0;0 340" dur="5s" repeatCount="indefinite" />
    </path>

    <rect x="72" y="211" width="8" height="8" rx="1" fill="#7C3AED">
