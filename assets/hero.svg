<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7FF36"/>
      <stop offset="0.48" stop-color="#506BFF"/>
      <stop offset="1" stop-color="#9D4EDD"/>
    </linearGradient>
    <linearGradient id="signal" x1="710" y1="66" x2="1128" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7FF36"/>
      <stop offset="1" stop-color="#506BFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#C8D1E0" stroke-opacity="0.075"/>
      <circle cx="1" cy="1" r="1" fill="#C8D1E0" fill-opacity="0.16"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
